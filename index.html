<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薬歴テンプレコピー</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="update-row">
    <h1 class="app-title">薬歴アシスト</h1>
    <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

    <button id="themeToggle" class="theme-toggle" type="button" aria-label="ダークモード切り替え" title="ダークモード切り替え">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></g></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <div class="tree-pane">
    <div class="view-tabs" role="tablist">
      <button type="button" class="view-tab active" data-view="tree" role="tab" aria-selected="true">階層ブラウズ</button>
      <button type="button" class="view-tab" data-view="index" role="tab" aria-selected="false">インデックス</button>
    </div>
    <div class="index-subtabs" id="indexSubtabs" hidden>
      <button type="button" class="index-subtab active" data-index-mode="drug">薬品名で探す</button>
      <button type="button" class="index-subtab" data-index-mode="category">薬効分類で探す</button>
    </div>
    <input type="search" id="searchInput" class="search-input" placeholder="🔍 見出しを検索…" aria-label="見出しを検索">
    <div id="drugAlphabetNav" class="drug-alphabet-nav" hidden></div>
    <ul id="headingList" class="heading-list"></ul>
    <p id="emptyMessage" class="empty-message"></p>
  </div>
  <aside class="detail-pane" id="detailPane" aria-live="polite"></aside>
</main>

<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
